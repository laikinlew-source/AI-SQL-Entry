[project]
name = "ai-sql-entry"
version = "0.1.0"
description = "Project scaffold for a future AI-assisted SQL input-processing workflow."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
ai-sql-entry = "ai_sql_entry.cli:main"
ai-sql-master-data = "ai_sql_entry.snapshot_cli:main"
ai-sql-master-data-acquire = "ai_sql_entry.master_data_acquisition_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
