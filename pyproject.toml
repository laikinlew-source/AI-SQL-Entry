[project]
name = "ai-sql-entry"
version = "0.1.0"
description = "Project scaffold for a future AI-assisted SQL input-processing workflow."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-sql-entry = "ai_sql_entry.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_sql_entry = ["invoice_aliases.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
